name: Label sponsors ❤️
on:
    pull_request:
        types:
            - opened
    issues:
        types:
            - opened
jobs:
    sponsor-label:
        name: Label sponsors ❤️
        runs-on: ubuntu-latest
        steps:
            - uses: JasonEtco/is-sponsor-label-action@39d88e461a53ecb1b3c0a13673e6252f9976f2f5 # v1
              with:
                label: Sponsor Request ❤️
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
